name: Android CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint, Test & Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9 (with cache)
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Lint
        id: lint
        run: gradle lintDebug --stacktrace

      - name: Unit tests
        id: tests
        run: gradle testDebugUnitTest --stacktrace

      - name: Build debug APK
        id: assemble
        run: gradle assembleDebug --stacktrace

      - name: Output Contract (PASS / FAIL)
        if: always()
        run: |
          {
            echo "## Output Contract"
            echo "- Lint: ${{ steps.lint.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
            echo "- Unit tests: ${{ steps.tests.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
            echo "- Build: ${{ steps.assemble.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: magic-chess-copilot-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload test & lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/lint-results-debug.html
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
