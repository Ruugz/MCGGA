name: Android CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # Cari folder project otomatis (root atau subfolder) dan pilih gradlew jika ada
      - name: Detect project root
        id: root
        run: |
          SETTINGS=$(find . -maxdepth 3 \( -name settings.gradle.kts -o -name settings.gradle \) | head -n 1)
          if [ -z "$SETTINGS" ]; then
            echo "::error::settings.gradle(.kts) tidak ditemukan. Ekstrak zip dulu, lalu upload ISI-nya ke repo."
            ls -R | head -50
            exit 1
          fi
          DIR=$(dirname "$SETTINGS")
          echo "dir=$DIR" >> "$GITHUB_OUTPUT"
          if [ -f "$DIR/gradle/wrapper/gradle-wrapper.jar" ] && [ -f "$DIR/gradlew" ]; then
            chmod +x "$DIR/gradlew"
            echo "cmd=./gradlew" >> "$GITHUB_OUTPUT"
          else
            echo "cmd=gradle" >> "$GITHUB_OUTPUT"
          fi
          echo "Project root: $DIR"

      - name: Build debug APK
        id: assemble
        working-directory: ${{ steps.root.outputs.dir }}
        run: ${{ steps.root.outputs.cmd }} assembleDebug --stacktrace

      - name: Upload debug APK
        if: steps.assemble.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: magic-chess-copilot-debug-apk
          path: ${{ steps.root.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Unit tests
        id: tests
        working-directory: ${{ steps.root.outputs.dir }}
        run: ${{ steps.root.outputs.cmd }} testDebugUnitTest --stacktrace

      # Lint tidak memblokir APK; hasilnya tetap dilaporkan
      - name: Lint
        id: lint
        continue-on-error: true
        working-directory: ${{ steps.root.outputs.dir }}
        run: ${{ steps.root.outputs.cmd }} lintDebug --stacktrace

      - name: Output Contract (PASS / FAIL)
        if: always()
        run: |
          {
            echo "## Output Contract"
            echo "- Build: ${{ steps.assemble.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
            echo "- Unit tests: ${{ steps.tests.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
            echo "- Lint: ${{ steps.lint.outcome == 'success' && '[PASS]' || '[FAIL]' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            ${{ steps.root.outputs.dir }}/app/build/reports/lint-results-debug.html
            ${{ steps.root.outputs.dir }}/app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
