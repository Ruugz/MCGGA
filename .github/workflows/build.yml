name: Build Magic Analyzer

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract project from zip
        run: |
          if [ -f "MagicAnalyzer_Fixed.zip" ]; then
            echo "Extracting MagicAnalyzer_Fixed.zip..."
            unzip -o MagicAnalyzer_Fixed.zip
            # Pindahkan isi folder ke root kalau masih di dalam subfolder
            if [ -d "MagicAnalyzer_GitHub" ]; then
              shopt -s dotglob
              mv MagicAnalyzer_GitHub/* .
              rm -rf MagicAnalyzer_GitHub
            fi
          fi
          ls -la

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Android SDK packages
        run: |
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0" || true
          yes | sdkmanager --licenses || true

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Gradle Wrapper
        run: |
          if [ ! -f "./gradlew" ]; then
            echo "gradlew not found, generating..."
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x ./gradlew
          ls -la

      - name: Build Debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: magic-analyzer-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
